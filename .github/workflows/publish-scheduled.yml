# 자동 발행 — 3단계(실발행). 설계: F-006 docs/auto-publish-design.md §6.
# 10분마다 돌아, 도래한 슬롯의 첫 통과 후보 1편을 blog/queue → main 으로 옮겨 커밋·push 한다(G1~G10 그대로).
# 긴급 정지: 저장소 변수 PUBLISH_PAUSED=1 (스크립트가 즉시 skip).
# 주의: GITHUB_TOKEN 으로 push 한 커밋은 deploy.yml 을 자동 기동하지 않는다.
#       배포 연결(gh workflow run deploy.yml → actions: write)은 오너/방장 결정 뒤에 추가한다 — 지금은 contents: write 만.
name: publish-scheduled

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # 발행 커밋 push 에만 필요. 그 외 권한 없음.

concurrency:
  group: auto-publish
  cancel-in-progress: false  # 발행 중인 틱을 끊지 않는다 — 대기열만 직렬로 돈다

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISH_PAUSED: ${{ vars.PUBLISH_PAUSED }}  # 1 이면 스크립트가 즉시 skip (긴급 정지 스위치)
    steps:
      # job 레벨 env 에는 runner 컨텍스트가 없다 — 경로는 $RUNNER_TEMP 로 만들어 이후 step 에 넘긴다.
      - name: Set state/log paths
        run: |
          echo "STATE_FILE=$RUNNER_TEMP/auto_publish_state.json" >> "$GITHUB_ENV"
          echo "LOG_FILE=$RUNNER_TEMP/auto_publish.log" >> "$GITHUB_ENV"

      - name: Checkout main (push 가 필요해 자격 증명 유지)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout blog/queue (대기열, 읽기 전용)
        uses: actions/checkout@v4
        with:
          ref: blog/queue
          path: queue
          fetch-depth: 0  # Iris 근거 커밋 탐색(git log)에 전체 이력이 필요
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 알림 억제(3시간) 상태 — run_id 키로 저장하고 prefix 로 가장 최근 것을 복원한다.
      # 잡이 성공해야 저장된다(스크립트는 hold/skip 도 exit 0).
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/auto_publish_state.json
          key: auto-publish-state-${{ github.run_id }}
          restore-keys: |
            auto-publish-state-

      - name: Auto-publish
        run: |
          set -o pipefail
          python3 scripts/auto_publish.py \
            --queue-dir queue \
            --schedule queue/posts/SCHEDULE.tsv \
            --main-dir . \
            --state-file "$STATE_FILE" 2>&1 | tee "$LOG_FILE"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## auto-publish"
            echo ""
            echo '```'
            grep -E '^(auto_publish|RESULT)' "$LOG_FILE" 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
